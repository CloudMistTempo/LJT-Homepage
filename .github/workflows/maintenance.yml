name: Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Remove temporary build-check branch
        run: git push origin --delete build-check
      - name: Enable GitHub Pages with Actions builds
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow || \
          gh api --method GET "/repos/${GITHUB_REPOSITORY}/pages"
